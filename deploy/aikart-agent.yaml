# Digest built, constrained-test verified and pushed by GitHub Actions run 36827123779.
# RELEASE GATE: package public visibility and anonymous pull are still pending verification.
# The official aiKart sandbox guide is a draft and the sandbox is described as upcoming.
apiVersion: aikart.dev/v1
kind: AgentManifest
metadata:
  name: tendertripwire
  displayName: "TenderTripwire"
  description: "Synthetic, evidence-linked tender checks with a self-hosted local model and human-gated packet preparation."
runtime:
  type: docker
  image: "ghcr.io/royalpm/tendertripwire-bharat-agentic@sha256:06da9c58f0a42b6e635514af77a83505fb714412ed6b2547f4c9f9934a99664f"
  command: ["bash", "scripts/container-run.sh", "aikart"]
resources:
  cpu: 2
  memoryMb: 4096
  timeoutSeconds: 280
inputs:
  - name: goal
    label: "Preparation goal (synthetic documents only)"
    type: textarea
    required: true
    default: "Required lots: A, B.\nCompare Lot A and Lot B. Request approval for a preparation packet only for a lot that passes every evidence check."
  - name: scenario
    label: "Synthetic evidence scenario"
    type: select
    required: true
    options: ["baseline", "missing", "conflict", "injection"]
    default: "baseline"
output:
  format: markdown
security:
  networkEgress: none
